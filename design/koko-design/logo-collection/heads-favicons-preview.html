<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Centered heads and favicons</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #21133e; background: #f7f4ee; }
    body { margin: 0; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 24px; color: #776b84; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; max-width: 980px; }
    article { padding: 18px; border: 1px solid #e1d7ed; border-radius: 20px; background: #fffdf8; box-shadow: 0 10px 24px rgba(55,32,83,.08); }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .art { display: grid; place-items: center; height: 180px; border-radius: 14px; background: #f1eee8; }
    .art img { width: 170px; height: 170px; object-fit: contain; }
    .favicon { display: flex; align-items: center; gap: 12px; margin-top: 14px; color: #776b84; font-size: 13px; }
    .favicon img { width: 64px; height: 64px; image-rendering: auto; border: 1px solid #e1d7ed; border-radius: 12px; background: #fff; }
  </style>
</head>
<body>
  <h1>Centered logo heads and regenerated favicons</h1>
  <p>Full-size centered source PNGs above; 128×128 favicon versions below.</p>
  <section class="grid">
    <article><h2>Koko</h2><div class="art"><img src="original-heads/LOGO-005-01-koko-head-original.png" alt="Centered Koko head"></div><div class="favicon"><img src="favicons/favicon-koko.png" alt="Koko favicon">favicon-koko.png</div></article>
    <article><h2>Gohanko</h2><div class="art"><img src="original-heads/LOGO-005-02-gohanko-head-original.png" alt="Centered Gohanko head"></div><div class="favicon"><img src="favicons/favicon-gohanko.png" alt="Gohanko favicon">favicon-gohanko.png</div></article>
    <article><h2>Bear</h2><div class="art"><img src="original-heads/LOGO-005-03-bear-head-original.png" alt="Centered Bear head"></div><div class="favicon"><img src="favicons/favicon-bear.png" alt="Bear favicon">favicon-bear.png</div></article>
    <article><h2>Rabbit</h2><div class="art"><img src="original-heads/LOGO-005-04-rabbit-head-original.png" alt="Centered Rabbit head"></div><div class="favicon"><img src="favicons/favicon-rabbit.png" alt="Rabbit favicon">favicon-rabbit.png</div></article>
    <article><h2>Yauyau</h2><div class="art"><img src="original-heads/LOGO-005-05-yauyau-head-original.png" alt="Centered Yauyau head"></div><div class="favicon"><img src="favicons/favicon-yauyau.png" alt="Yauyau favicon">favicon-yauyau.png</div></article>
    <article><h2>Tree</h2><div class="art"><img src="original-heads/LOGO-005-06-tree-head-original.png" alt="Centered Tree head"></div><div class="favicon"><img src="favicons/favicon-tree.png" alt="Tree favicon">favicon-tree.png</div></article>
  </section>
</body>
</html>

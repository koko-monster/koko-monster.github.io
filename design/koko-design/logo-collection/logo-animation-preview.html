<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kokomonster logo animation preview</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #21133e; background: #f7f4ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .stage { width: min(1492px, 100%); display: grid; gap: 16px; justify-items: center; }
    .stage h1 { margin: 0; font-size: 18px; }
    .logo-frame { position: relative; width: 100%; aspect-ratio: 1492 / 450; min-height: 160px; overflow: hidden; display: flex; align-items: center; padding: 0 3.2%; border: 1px solid #e1d7ed; border-radius: 28px; background: rgba(255,253,248,.96); box-shadow: 0 16px 40px rgba(55,32,83,.12); }
    .row { position: relative; width: 100%; height: 100%; display: flex; align-items: center; gap: clamp(2px, .65vw, 10px); }
    .slot { position: relative; flex: 1 1 0; min-width: 0; height: 74%; display: grid; place-items: center; }
    .head { width: 100%; height: 100%; object-fit: contain; opacity: 0; transform: translateY(5px) scale(.96); transition: none; }
    .head.is-visible { opacity: 1; transform: translateY(0) scale(1); }
    /* Optical eye-line corrections keep the six faces level despite different silhouettes. */
    .slot:nth-child(1) .head.is-visible { transform: translateY(3%) scale(1.16); }
    .slot:nth-child(2) .head.is-visible { transform: translateX(2.5%) translateY(2%) scale(1.07); }
    .slot:nth-child(3) .head.is-visible { transform: translateX(2%) translateY(3%) scale(1); }
    /* Rabbit's tall ears and Tree's crown need more visual weight and a higher anchor. */
    .slot:nth-child(4) .head.is-visible { transform: translateX(3%) translateY(-8%) scale(1.14); }
    .slot:nth-child(5) .head.is-visible { transform: translateY(-5%) scale(1.02); }
    .slot:nth-child(6) .head.is-visible { transform: translateY(-4%) scale(1); }
    .wordmark { position: absolute; left: calc(16.666% + clamp(2px, .65vw, 10px)); top: calc(50% + 2px); width: calc(83.333% - clamp(2px, .65vw, 10px)); height: auto; max-height: 30%; object-fit: contain; object-position: left center; opacity: 0; transform: translateY(-50%) translateX(-8px); transition: none; }
    .logo-frame.wordmark-mode .slot:not(:first-child) .head { opacity: 0; transform: translateY(0) scale(.98); }
    .logo-frame.wordmark-mode .wordmark { opacity: 1; transform: translateY(-50%) translateX(0); }
    .caption { margin: 0; color: #776b84; font-size: 13px; letter-spacing: .04em; }
    @media (prefers-reduced-motion: reduce) {
      .head, .wordmark { transition: none; }
      .head { opacity: 1; transform: none; }
      .logo-frame.wordmark-mode .slot:not(:first-child) .head { opacity: 0; }
      .logo-frame.wordmark-mode .wordmark { opacity: 1; transform: translateY(-50%); }
    }
  </style>
<link rel="icon" type="image/png" sizes="64x64" href="../../../design/koko-design/logo-collection/favicons/favicon-koko.png?v=20261005-1" data-random-favicon data-favicon-root="../../../design/koko-design/logo-collection/favicons/"><link rel="stylesheet" href="../../../brand-logo.css?v=20261005-1"><script src="../../../favicon.js?v=20261005-1"></script><script defer src="../../../brand-logo.js?v=20261005-1"></script></head>
<body>
  <main class="stage">
    <h1>Logo animation preview</h1>
    <section class="logo-frame" id="logo" aria-label="Kokomonster animated logo">
      <div class="row" aria-hidden="true">
        <div class="slot"><img class="head" src="original-heads/LOGO-005-01-koko-head-original.png" alt=""></div>
        <div class="slot"><img class="head" src="original-heads/LOGO-005-02-gohanko-head-original.png" alt=""></div>
        <div class="slot"><img class="head" src="original-heads/LOGO-005-03-bear-head-original.png" alt=""></div>
        <div class="slot"><img class="head" src="original-heads/LOGO-005-04-rabbit-head-original.png" alt=""></div>
        <div class="slot"><img class="head" src="original-heads/LOGO-005-05-yauyau-head-original.png" alt=""></div>
        <div class="slot"><img class="head" src="original-heads/LOGO-005-06-tree-head-original.png" alt=""></div>
        <img class="wordmark" src="LOGO-001-kokomonster-wordmark-source.png" alt="KOKOMONSTER">
      </div>
    </section>
    <p class="caption" id="status" role="status" aria-live="polite">Heads appear one by one</p>
  </main>
  <script>
    const frame = document.querySelector('#logo');
    const heads = [...document.querySelectorAll('.head')];
    const status = document.querySelector('#status');
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    async function play() {
      frame.classList.remove('wordmark-mode');
      heads.forEach(h => h.classList.remove('is-visible'));
      for (let i = 0; i < heads.length; i++) {
        heads[i].classList.add('is-visible');
        status.textContent = `Head ${i + 1} of 6`;
        await wait(520);
      }
      status.textContent = 'Six heads';
      await wait(2000);
      frame.classList.add('wordmark-mode');
      status.textContent = 'Koko head + KOKOMONSTER';
      await wait(15000);
      status.textContent = 'Logo complete · refresh to replay';
    }
    play();
  </script>
</body>
</html>

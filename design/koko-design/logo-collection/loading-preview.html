<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kokomonster loading animation preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f4ee; color: #21133e; }
    .stage { display: grid; justify-items: center; gap: 22px; padding: 32px; }
    .loader { width: 154px; height: 154px; display: grid; place-items: center; gap: 10px; padding: 20px 16px 18px; border: 1px solid #e1d7ed; border-radius: 24px; background: rgba(255,253,248,.96); box-shadow: 0 14px 34px rgba(55,32,83,.12); }
    .heads { width: 120px; height: 64px; display: flex; align-items: end; justify-content: center; gap: 4px; }
    /* All six source PNGs use the same 512 × 512 transparent canvas. Keep each
       slot fixed and bottom-aligned so combinations share one visual baseline. */
    .head { width: 36px; height: 60px; object-fit: contain; object-position: center bottom; opacity: 0; transform: translateY(4px) scale(.96); transition: opacity .32s ease, transform .32s ease; }
    .head.is-visible { opacity: 1; transform: translateY(0) scale(1); }
    .dots { display: flex; gap: 6px; height: 12px; align-items: center; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6934d7; animation: pulse 1s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: .16s; background: #ef4d83; }
    .dot:nth-child(3) { animation-delay: .32s; background: #69df62; }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: translateY(0) scale(.8); } 50% { opacity: 1; transform: translateY(-4px) scale(1); } }
    .stage h1 { margin: 0; font-size: 16px; font-weight: 700; }
    @media (prefers-reduced-motion: reduce) {
      .head { transition: none; opacity: 0; transform: none; }
      .head:first-child, .head:nth-child(2), .head:nth-child(3) { opacity: 1; }
      .dot { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-labelledby="title">
    <h1 id="title">Loading preview</h1>
    <div class="loader" role="status" aria-live="polite" aria-label="Loading">
      <div class="heads" aria-hidden="true">
        <img class="head" alt="" width="36" height="60">
        <img class="head" alt="" width="36" height="60">
        <img class="head" alt="" width="36" height="60">
      </div>
      <div class="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
  </main>
  <script>
    const base = 'original-heads/';
    const heads = [
      ['Koko', 'LOGO-005-01-koko-head-original.png'],
      ['Gohanko', 'LOGO-005-02-gohanko-head-original.png'],
      ['Bear', 'LOGO-005-03-bear-head-original.png'],
      ['Rabbit', 'LOGO-005-04-rabbit-head-original.png'],
      ['Yauyau', 'LOGO-005-05-yauyau-head-original.png'],
      ['Tree', 'LOGO-005-06-tree-head-original.png']
    ];
    const combinations = [];
    for (let a = 0; a < heads.length - 2; a++) for (let b = a + 1; b < heads.length - 1; b++) for (let c = b + 1; c < heads.length; c++) combinations.push([a, b, c]);
    let bag = [], current = -1;
    const slots = [...document.querySelectorAll('.head')];
    function refill() {
      bag = combinations.map((_, i) => i).sort(() => Math.random() - .5);
      if (bag[0] === current) [bag[0], bag[1]] = [bag[1], bag[0]];
    }
    function showNext() {
      if (!bag.length) refill();
      current = bag.shift();
      const combo = combinations[current];
      slots.forEach((slot, i) => {
        slot.classList.remove('is-visible');
        window.setTimeout(() => { slot.src = base + heads[combo[i]][1]; slot.classList.add('is-visible'); }, i * 90);
      });
    }
    showNext();
    window.setInterval(showNext, 1800);
  </script>
</body>
</html>
